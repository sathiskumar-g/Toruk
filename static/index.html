<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TORUKMACTO - Reddit Problem Research</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>TORUKMACTO</h1>
            <p class="subtitle">Automated Reddit Problem Research Engine</p>
        </header>

        <div class="input-section">
            <div class="input-group">
                <input 
                    type="text" 
                    id="keywordInput" 
                    placeholder="Enter a problem keyword (e.g., 'n8n debugging is hard')"
                    onkeypress="handleKeyPress(event)"
                >
                <button onclick="addKeyword()" class="btn btn-add">Add Keyword</button>
            </div>
            <div class="input-row">
                <div class="limit-control">
                    <label for="limitInput">Posts per keyword:</label>
                    <input type="number" id="limitInput" value="5" min="1" max="25">
                </div>
                <div class="source-control">
                    <label for="sourceSelect">Source:</label>
                    <select id="sourceSelect">
                        <option value="reddit" selected>Reddit</option>
                        <option value="hackernews">Hacker News</option>
                        <option value="github">GitHub Issues</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="keywords-section">
            <div class="keywords-header">
                <h3>Research Keywords (<span id="keywordCount">0</span>)</h3>
                <button onclick="clearAllKeywords()" class="btn btn-clear">Clear All</button>
            </div>
            <div id="keywordsList" class="keywords-list">
                <!-- Keywords will be added here -->
            </div>
        </div>

        <div class="action-section">
            <button onclick="runResearch()" class="btn btn-primary " id="researchBtn">
                🚀 Run Research
            </button>
        </div>

        <div id="loadingSection" class="loading-section" style="display: none;">
            <div class="loader"></div>
            <p>Searching Reddit for problems...</p>
            <p class="loading-detail" id="loadingDetail">Initializing...</p>
        </div>

        <div id="resultsSection" class="results-section" style="display: none;">
            <div class="results-header">
                <h2>📊 Research Results</h2>
                <button onclick="exportResults()" class="btn btn-export">Export JSON</button>
            </div>
            
            <div class="summary-cards">
                <div class="card">
                    <div class="card-value" id="totalKeywords">0</div>
                    <div class="card-label">Keywords Searched</div>
                </div>
                <div class="card">
                    <div class="card-value" id="totalOpportunities">0</div>
                    <div class="card-label">Opportunities Found</div>
                </div>
                <div class="card">
                    <div class="card-value" id="topScore">0</div>
                    <div class="card-label">Top Score</div>
                </div>
            </div>

            <div class="keyword-summary">
                <h3>Keyword Summary</h3>
                <div id="keywordSummaryTable"></div>
            </div>

            <div class="opportunities">
                <div class="opportunities-header">
                    <h3>Opportunities</h3>
                    <div class="view-toggle">
                        <button onclick="showTopOpportunities()" class="btn-toggle active" id="topBtn">Top 10</button>
                        <button onclick="showAllOpportunities()" class="btn-toggle" id="allBtn">All (<span id="allCount">0</span>)</button>
                    </div>
                </div>
                <div id="opportunitiesList"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
